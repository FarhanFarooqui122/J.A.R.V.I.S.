<!doctype html><html><head><meta charset="utf-8"><title>J.A.R.V.I.S</title>
<style>
:root{--c:rgb(0,200,255)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#010a10;color:var(--c);overflow:hidden;font-family:Orbitron,Rajdhani,"Segoe UI",Consolas,monospace}
body{background-image:linear-gradient(rgba(0,200,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.05) 1px,transparent 1px);background-size:44px 44px}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.8))}
canvas{position:fixed;inset:0;width:100%;height:100%}
.p{position:fixed;border:1px solid color-mix(in srgb,var(--c) 30%,transparent);background:rgba(0,18,28,.45);padding:14px 16px;font-size:12px;letter-spacing:.08em}
.p:before,.p:after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--c)}
.p:before{top:-2px;left:-2px;border-right:0;border-bottom:0}.p:after{bottom:-2px;right:-2px;border-left:0;border-top:0}
h3{margin:0 0 10px;font-size:11px;opacity:.7;letter-spacing:.3em;font-weight:400}
#L{left:28px;top:96px;width:250px}#R{right:28px;top:96px;bottom:70px;width:340px;display:flex;flex-direction:column}
#log{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:7px}
.u{color:#9fb8c4}.j{color:#e8fbff}.a{color:#ffb000;font-size:11px}.s{opacity:.5;font-size:11px}
.row{margin:9px 0}.bar{height:5px;background:rgba(255,255,255,.08);margin-top:4px}.bar i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 8px var(--c);transition:width .6s}
#top{position:fixed;top:22px;width:100%;text-align:center}#top b{font-size:28px;letter-spacing:.5em;text-shadow:0 0 18px var(--c)}#top div{font-size:9px;letter-spacing:.4em;opacity:.55;margin-top:6px}
#clock{position:fixed;left:30px;top:26px;font-size:20px;text-shadow:0 0 10px var(--c)}#clock small{display:block;font-size:10px;opacity:.6;letter-spacing:.2em}
#link{position:fixed;right:30px;top:30px;font-size:11px;letter-spacing:.25em}
#st{position:fixed;bottom:34px;width:100%;text-align:center;font-size:22px;letter-spacing:.6em;text-shadow:0 0 14px var(--c)}
#st small{display:block;font-size:10px;letter-spacing:.3em;opacity:.5;margin-top:8px}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><b>J.A.R.V.I.S</b><div>JUST A RATHER VERY INTELLIGENT SYSTEM</div></div>
<div id="clock"><span id="t"></span><small id="d"></small></div><div id="link">LINK: ...</div>
<div class="p" id="L"><h3>SYSTEM STATUS</h3>
<div class="row">CPU <span id="cpuv" style="float:right">--</span><div class="bar"><i id="cpu"></i></div></div>
<div class="row">MEMORY <span id="ramv" style="float:right">--</span><div class="bar"><i id="ram"></i></div></div>
<div class="row">POWER <span id="batv" style="float:right">--</span><div class="bar"><i id="bat"></i></div></div>
<div class="row s">UPTIME <span id="up" style="float:right">00:00:00</span></div></div>
<div class="p" id="R"><h3>COMMUNICATIONS LOG</h3><div id="log"></div></div>
<div id="st"><span id="sv">STANDBY</span><small>SAY "HEY JARVIS"</small></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d');
const COL={idle:[0,200,255],listening:[70,255,215],thinking:[255,176,0],speaking:[150,240,255],error:[255,70,70]},
 TXT={idle:'STANDBY',listening:'LISTENING',thinking:'PROCESSING',speaking:'SPEAKING',error:'ERROR'};
let st='idle',cur=[...COL.idle],lvl=0,tgt=0,lastLv=0,W,H,t0=performance.now(),bars=new Array(72).fill(0),demo=location.protocol==='file:'||location.search.includes('demo');
function rs(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight}
addEventListener('resize',rs);rs();
function setState(s){st=s;$('sv').textContent=TXT[s]||s.toUpperCase()}
function log(cls,txt,type){const e=document.createElement('div');e.className=cls;$('log').appendChild(e);
 while($('log').children.length>30)$('log').firstChild.remove();
 if(!type){e.textContent=txt;return}let i=0;const p=txt;const iv=setInterval(()=>{e.textContent=p.slice(0,++i);if(i>=p.length)clearInterval(iv)},16)}
function msg(m){if(m.type=='state')setState(m.v);else if(m.type=='level'){tgt=m.v;lastLv=performance.now()}
 else if(m.type=='user')log('u','YOU › '+m.text);else if(m.type=='jarvis')log('j','JARVIS › '+m.text,1);
 else if(m.type=='action')log('a','▸ '+m.name.toUpperCase()+(m.arg?' · '+m.arg:''))}
function ring(r,w,a0,a1,al){x.beginPath();x.arc(0,0,r,a0,a1);x.lineWidth=w;x.globalAlpha=al;x.stroke()}
function frame(now){const t=(now-t0)/1000,k=[0,1,2].map(i=>cur[i]+=(COL[st][i]-cur[i])*.06),c=`rgb(${k.map(Math.round)})`;
 document.documentElement.style.setProperty('--c',c);
 if(demo){const ph=Math.floor(t/4)%4;setState(['idle','listening','thinking','speaking'][ph]);tgt=ph==1||ph==3?.4+.4*Math.sin(t*9)*Math.sin(t*3.1):.08;lastLv=now}
 if(st=='speaking'&&now-lastLv>400)tgt=.35+.3*Math.sin(t*11)*Math.sin(t*4.3);
 if(now-lastLv>1500&&!demo)tgt=0;lvl+=(tgt-lvl)*.25;
 const fast=st=='thinking'?3:1,R=Math.min(W,H)*.27;
 x.clearRect(0,0,W,H);x.save();x.translate(W/2,H/2);x.strokeStyle=x.fillStyle=c;x.shadowColor=c;x.shadowBlur=14;x.lineCap='butt';
 const g=x.createRadialGradient(0,0,0,0,0,R*.4);g.addColorStop(0,'#fff');g.addColorStop(.25,c);g.addColorStop(1,'transparent');
 x.globalAlpha=.9;x.fillStyle=g;x.beginPath();x.arc(0,0,R*(.22+.12*lvl+.015*Math.sin(t*3)),0,7);x.fill();
 x.save();x.rotate(t*.4*fast);for(let i=0;i<10;i++){x.rotate(Math.PI/5);x.globalAlpha=.8;x.fillRect(R*.34,-R*.045,R*.08,R*.09)}x.restore();
 ring(R*.5,1.5,0,7,.6);x.save();x.rotate(-t*.6*fast);x.setLineDash([R*.07,R*.05]);ring(R*.58,3,0,7,.7);x.restore();
 x.save();x.rotate(t*.3*fast);for(let i=0;i<3;i++)ring(R*.74,7,i*2.09,i*2.09+1.4,.85);x.restore();
 x.save();x.rotate(t*.1);for(let i=0;i<120;i++){x.rotate(Math.PI/60);x.globalAlpha=.7;x.fillRect(R*.9,-.5,i%5?4:10,1)}x.restore();
 for(let i=0;i<72;i++){const n=.5+.5*Math.sin(t*5+i*1.7)*Math.cos(t*2.3+i*.6);bars[i]+=(lvl*(.35+.65*n)-bars[i])*.35;
  x.save();x.rotate(i/72*6.2832);x.globalAlpha=.85;x.fillRect(R*1.02,-1.5,6+bars[i]*R*.45,3);x.restore()}
 x.save();x.rotate(t*.8*fast);for(let i=0;i<24;i++){x.rotate(-.045);x.globalAlpha=.22*(1-i/24);x.fillRect(0,-1,R*1.35,2)}x.restore();
 x.save();x.rotate(-t*.25);ring(R*1.42,1,0,7,.25);for(let i=0;i<3;i++){x.rotate(2.09);x.globalAlpha=.9;x.beginPath();x.arc(R*1.42,0,4,0,7);x.fill()}x.restore();
 x.restore();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
const T0=Date.now(),z=n=>String(n).padStart(2,'0');
setInterval(()=>{const n=new Date;$('t').textContent=z(n.getHours())+':'+z(n.getMinutes())+':'+z(n.getSeconds());
 $('d').textContent=n.toDateString().toUpperCase();const u=(Date.now()-T0)/1000|0;$('up').textContent=z(u/3600|0)+':'+z(u/60%60|0)+':'+z(u%60)},500);
function bar(id,v){if(v==null)return;$(id).style.width=v+'%';$(id+'v').textContent=Math.round(v)+'%'}
async function stats(){try{const d=await (await fetch('/stats')).json();bar('cpu',d.cpu);bar('ram',d.ram);bar('bat',d.bat)}catch(e){}}
if(demo){$('link').textContent='LINK: DEMO';log('s','DEMO MODE · no live link');log('u','YOU › open chrome');log('j','JARVIS › Opening Chrome, sir.');bar('cpu',23);bar('ram',48);bar('bat',87)}
else{const es=new EventSource('/events');es.onopen=()=>{$('link').textContent='LINK: ONLINE';log('s','SYSTEM ONLINE')};
 es.onerror=()=>$('link').textContent='LINK: OFFLINE';es.onmessage=e=>msg(JSON.parse(e.data));stats();setInterval(stats,2000)}
</script></body></html>
